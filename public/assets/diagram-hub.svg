<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Hub measurements</title>
  <desc id="desc">Rear hub diagram showing left and right pitch circle diameters and flange distances WL and WR.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#264ba7"/></marker>
    <linearGradient id="hub" x1="0" x2="1"><stop offset="0" stop-color="#263246"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#35425a"/></linearGradient>
  </defs>
  <line x1="72" y1="171" x2="688" y2="171" stroke="#aeb7c8" stroke-width="3"/>
  <line x1="380" y1="45" x2="380" y2="273" stroke="#264ba7" stroke-width="3" stroke-dasharray="7 7"/>
  <g stroke="#172033" stroke-width="4" stroke-linejoin="round">
    <rect x="112" y="155" width="536" height="32" rx="8" fill="#dfe4eb"/>
    <path d="M210 126 H270 L314 142 H446 L490 126 H550 V216 H490 L446 200 H314 L270 216 H210 Z" fill="url(#hub)"/>
    <path d="M238 75 H268 V267 H238 Z M492 75 H522 V267 H492 Z" fill="#172033"/>
    <path d="M550 118 H625 L642 136 V206 L625 224 H550 Z" fill="#8a94a7"/>
    <line x1="570" y1="131" x2="570" y2="211"/><line x1="589" y1="128" x2="589" y2="214"/><line x1="608" y1="128" x2="608" y2="214"/>
  </g>
  <g fill="none" stroke="#264ba7" stroke-width="3">
    <line x1="253" y1="58" x2="380" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="380" y1="58" x2="507" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="253" y1="49" x2="253" y2="75"/><line x1="507" y1="49" x2="507" y2="75"/>
    <line x1="82" y1="75" x2="82" y2="267" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="678" y1="75" x2="678" y2="267" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="94" y1="75" x2="238" y2="75"/><line x1="94" y1="267" x2="238" y2="267"/>
    <line x1="522" y1="75" x2="666" y2="75"/><line x1="522" y1="267" x2="666" y2="267"/>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="316" y="42" text-anchor="middle">WL</text><text x="444" y="42" text-anchor="middle">WR</text>
    <text x="64" y="177" text-anchor="middle" transform="rotate(-90 64 177)">PCD L</text>
    <text x="696" y="177" text-anchor="middle" transform="rotate(90 696 177)">PCD R</text>
  </g>
</svg>
