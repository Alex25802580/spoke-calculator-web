<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Rim offset</title>
  <desc id="desc">Comparison between a symmetric rim and an asymmetric rim shifted from the hub centreline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#264ba7"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(75 28)">
      <text x="140" y="22" fill="#172033" font-size="20" font-weight="700" text-anchor="middle">Symmetric rim</text>
      <line x1="140" y1="42" x2="140" y2="264" stroke="#264ba7" stroke-width="3" stroke-dasharray="7 7"/>
      <path d="M60 72 H220 L213 121 C208 169 185 213 140 237 C95 213 72 169 67 121 Z" fill="none" stroke="#172033" stroke-width="6" stroke-linejoin="round"/>
      <path d="M79 76 L88 120 C97 158 113 178 140 188 C167 178 183 158 192 120 L201 76" fill="none" stroke="#172033" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="140" cy="188" r="7" fill="#264ba7"/>
    </g>
    <g transform="translate(405 28)">
      <text x="140" y="22" fill="#172033" font-size="20" font-weight="700" text-anchor="middle">Asymmetric rim</text>
      <line x1="140" y1="42" x2="140" y2="264" stroke="#aeb7c8" stroke-width="3" stroke-dasharray="7 7"/>
      <path d="M60 72 H220 L213 121 C208 169 185 213 140 237 C95 213 72 169 67 121 Z" fill="none" stroke="#172033" stroke-width="6" stroke-linejoin="round"/>
      <path d="M79 76 L88 120 C97 158 121 178 158 188 C185 178 197 157 202 120 L205 76" fill="none" stroke="#172033" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="158" cy="188" r="7" fill="#264ba7"/>
      <line x1="140" y1="225" x2="158" y2="225" stroke="#264ba7" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="149" y="252" fill="#264ba7" font-size="16" font-weight="700" text-anchor="middle">Offset</text>
    </g>
  </g>
</svg>
